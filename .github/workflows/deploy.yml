name: Build & Deploy to AWS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Build React
      - name: Build React
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup server (first time)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo yum update -y
            sudo yum install -y git
            sudo amazon-linux-extras install ansible2 -y

      - name: Clone repo
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            if [ ! -d "/home/${{ secrets.VM_USER }}/devops-ansible" ]; then
              git clone https://github.com/duyle1062/devops-ansible.git
            else
              cd devops-ansible && git pull
            fi

      # 4. Prepare folder on EC2
      - name: Prepare deploy folder
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.VM_USER }}/devops-ansible/deploy

      # 5. Clean old files
      - name: Clean deploy folder
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            rm -rf /home/${{ secrets.VM_USER }}/devops-ansible/deploy/*

      # 6. Copy build to server (FIXED)
      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "frontend/build/"
          target: "/home/${{ secrets.VM_USER }}/devops-ansible/deploy/"

      # 7. Verify copy (debug)
      - name: Verify files on server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            ls -la /home/${{ secrets.VM_USER }}/devops-ansible/deploy

      # 8. Deploy with Ansible
      - name: Deploy with Ansible
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/devops-ansible/
            git pull
            cd ansible
            ansible-playbook -i inventory.ini site.yml
