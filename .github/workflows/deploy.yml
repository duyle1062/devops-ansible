name: Build & Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install & Build React
      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build React app
        run: |
          cd frontend
          npm run build

      # 4. Copy build lên EC2
      - name: Copy React build to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "frontend/build/*"
          target: "/home/${{ secrets.VM_USER }}/devops-ansible/deploy/"

      # 5. Copy Ansible lên EC2
      - name: Copy Ansible files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "ansible/*"
          target: "/home/${{ secrets.VM_USER }}/devops-ansible/"

      # 6. Setup server (install git + ansible nếu chưa có)
      - name: Setup server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # wait nếu yum bị lock
            while sudo fuser /var/run/yum.pid >/dev/null 2>&1; do
              echo "Waiting for yum lock..."
              sleep 5
            done

            sudo yum update -y
            sudo yum install -y git
            sudo amazon-linux-extras install ansible2 -y

            mkdir -p /home/${{ secrets.VM_USER }}/devops-ansible/deploy

      # 7. Deploy bằng Ansible
      - name: Run Ansible
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/devops-ansible/ansible
            ansible-playbook -i inventory.ini site.yml
