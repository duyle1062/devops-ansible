- name: Install nginx
  apt:
    name: nginx
    state: present
  become: yes

- name: Start nginx
  service:
    name: nginx
    state: started
    enabled: yes
  become: yes

- name: Configure nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: restart nginx
  become: yes
